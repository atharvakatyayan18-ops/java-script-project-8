    }
}

    let p2 = new superhero ("spiderman","resembles a spider")
    let p3 = new superhero ("iron man","resembles technology idk why")


document.getElementById(card1).innerHTML = p1.describe() + "<br>";
document.getElementById(card1).innerHTML = p2.describe() + "<br>";
document.getElementById(card1).innerHTML = p3.describe() + "<br>";
}
